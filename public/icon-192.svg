<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <filter id="dropShadow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Plate for App Icon -->
  <rect x="6" y="6" width="180" height="180" rx="40" fill="url(#bgGrad192)" stroke="#1c1917" stroke-width="6"/>
  
  <!-- Outer Gold Dashed Ring -->
  <circle cx="96" cy="96" r="78" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6,6" opacity="0.7"/>

  <!-- Main Battle Cat -->
  <g filter="url(#dropShadow192)">
    <!-- Cat Ears -->
    <!-- Left Ear -->
    <path d="M 52 71 L 36 30 L 73 51 Z" fill="#ffffff" stroke="#1c1917" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 54 66 L 43 38 L 68 51 Z" fill="#fecdd3"/>
    
    <!-- Right Ear -->
    <path d="M 140 71 L 156 30 L 119 51 Z" fill="#ffffff" stroke="#1c1917" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 138 66 L 149 38 L 124 51 Z" fill="#fecdd3"/>

    <!-- Left Leg -->
    <rect x="68" y="137" width="14" height="19" rx="7" fill="#ffffff" stroke="#1c1917" stroke-width="6"/>
    <!-- Right Leg -->
    <rect x="110" y="137" width="14" height="19" rx="7" fill="#ffffff" stroke="#1c1917" stroke-width="6"/>

    <!-- Cat Head & Body (Egg shape) -->
    <ellipse cx="96" cy="103" rx="54" ry="49" fill="#ffffff" stroke="#1c1917" stroke-width="7"/>

    <!-- Cat Facial Features -->
    <!-- Left Eye -->
    <ellipse cx="77" cy="96" rx="6" ry="9" fill="#1c1917"/>
    <!-- Right Eye -->
    <ellipse cx="115" cy="96" rx="6" ry="9" fill="#1c1917"/>

    <!-- Cute Cat Mouth -->
    <path d="M 85 111 Q 91 118 96 111 Q 102 118 107 111" fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="62" cy="105" rx="7" ry="4.5" fill="#fda4af" opacity="0.7"/>
    <ellipse cx="130" cy="105" rx="7" ry="4.5" fill="#fda4af" opacity="0.7"/>
  </g>
</svg>
