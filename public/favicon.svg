<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Golden Stamp Circle with Thick Border -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="#1c1917" stroke-width="4"/>
  
  <!-- Subtle inner ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Main Battle Cat Body (White round feline) -->
  <g filter="url(#dropShadow)">
    <!-- Cat Ears -->
    <!-- Left Ear -->
    <path d="M 27 38 L 18 16 L 38 27 Z" fill="#ffffff" stroke="#1c1917" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 28 35 L 22 20 L 35 27 Z" fill="#fecdd3" opacity="0.85"/>
    
    <!-- Right Ear -->
    <path d="M 73 38 L 82 16 L 62 27 Z" fill="#ffffff" stroke="#1c1917" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 72 35 L 78 20 L 65 27 Z" fill="#fecdd3" opacity="0.85"/>

    <!-- Cat Head & Body (Egg-like rounded Battle Cat silhouette) -->
    <ellipse cx="50" cy="54" rx="28" ry="25" fill="#ffffff" stroke="#1c1917" stroke-width="3.5"/>

    <!-- Left Leg -->
    <rect x="35" y="73" width="7" height="9" rx="3.5" fill="#ffffff" stroke="#1c1917" stroke-width="3"/>
    <!-- Right Leg -->
    <rect x="58" y="73" width="7" height="9" rx="3.5" fill="#ffffff" stroke="#1c1917" stroke-width="3"/>

    <!-- Cat Facial Features -->
    <!-- Left Eye (Vertical oval, authentic Battle Cat look) -->
    <ellipse cx="40" cy="50" rx="3" ry="4.5" fill="#1c1917"/>
    <!-- Right Eye -->
    <ellipse cx="60" cy="50" rx="3" ry="4.5" fill="#1c1917"/>

    <!-- Cute Cat Mouth ("3" / "w" shaped line) -->
    <path d="M 44 58 Q 47 62 50 58 Q 53 62 56 58" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="32" cy="55" rx="3" ry="2" fill="#fda4af" opacity="0.6"/>
    <ellipse cx="68" cy="55" rx="3" ry="2" fill="#fda4af" opacity="0.6"/>
  </g>
</svg>
