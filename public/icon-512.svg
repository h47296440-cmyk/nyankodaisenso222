<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <filter id="dropShadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Plate for App Icon -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad512)" stroke="#1c1917" stroke-width="16"/>
  
  <!-- Outer Gold Dashed Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#fbbf24" stroke-width="10" stroke-dasharray="14,14" opacity="0.7"/>

  <!-- Main Battle Cat -->
  <g filter="url(#dropShadow512)">
    <!-- Cat Ears -->
    <!-- Left Ear -->
    <path d="M 140 190 L 95 80 L 195 135 Z" fill="#ffffff" stroke="#1c1917" stroke-width="18" stroke-linejoin="round"/>
    <path d="M 145 175 L 115 100 L 180 135 Z" fill="#fecdd3"/>
    
    <!-- Right Ear -->
    <path d="M 372 190 L 417 80 L 317 135 Z" fill="#ffffff" stroke="#1c1917" stroke-width="18" stroke-linejoin="round"/>
    <path d="M 367 175 L 397 100 L 332 135 Z" fill="#fecdd3"/>

    <!-- Left Leg -->
    <rect x="180" y="365" width="36" height="50" rx="18" fill="#ffffff" stroke="#1c1917" stroke-width="16"/>
    <!-- Right Leg -->
    <rect x="296" y="365" width="36" height="50" rx="18" fill="#ffffff" stroke="#1c1917" stroke-width="16"/>

    <!-- Cat Head & Body (Egg shape) -->
    <ellipse cx="256" cy="275" rx="145" ry="130" fill="#ffffff" stroke="#1c1917" stroke-width="18"/>

    <!-- Cat Facial Features -->
    <!-- Left Eye -->
    <ellipse cx="205" cy="255" rx="15" ry="24" fill="#1c1917"/>
    <!-- Right Eye -->
    <ellipse cx="307" cy="255" rx="15" ry="24" fill="#1c1917"/>

    <!-- Cute Cat Mouth -->
    <path d="M 226 295 Q 241 315 256 295 Q 271 315 286 295" fill="none" stroke="#1c1917" stroke-width="14" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="165" cy="280" rx="18" ry="12" fill="#fda4af" opacity="0.7"/>
    <ellipse cx="347" cy="280" rx="18" ry="12" fill="#fda4af" opacity="0.7"/>
  </g>
</svg>
